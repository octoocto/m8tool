[package]
name = "m8tool"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = "0.4.43"
clap = { version = "4.5.59", features = ["derive"] }
console = "0.16.2"
fancy-regex = "0.17.0"
indicatif = "0.18.6"
regex = "1.12.3"
shrinkpath = "0.1.1"
walkdir = "2.5.0"
godot = { version = "0.5.2", features = ["register-docs"], optional = true }
human_bytes = "0.4.3"
sysinfo = "0.38.4"
which = "8.0.2"

[features]
gdext = ["dep:godot"]
