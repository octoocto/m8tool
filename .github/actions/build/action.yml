name: Godot Build
description: Build GDExtension for Linux, Windows, and MacOS

inputs:
  platform:
    required: true
    description: Target platform.
  arch:
    required: true
    description: Target architecture.
  build-target-type:
    default: "template_debug"
    description: Build type (template_debug or template_release).
  scons-cache:
    default: ".scons-cache/"
    description: Scons cache folder name, relative to each scons directory. Must not contain relative path signifiers (. or ..). Must be a transparent path part (empty or 'path/to/directory/', ending in a slash).
  gdextension-directory:
    default: ""
    description: Location of the gdextension project within the repository. Must not contain relative path signifiers (. or ..). Must be a transparent path part (empty or 'path/to/directory/', ending in a slash).

runs:
  using: composite
  steps:
    # Linux only

    - name: Linux - Install dependencies
      if: ${{ inputs.platform == 'linux' }}
      shell: sh
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qqq build-essential pkg-config
        sudo apt-get install pkg-config cmake ninja-build libasound2-dev libpulse-dev \
        libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
        libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
        libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
        libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
        libpipewire-0.3-dev

    # MacOS only

    - name: MacOS - Set up Homebrew
      if: ${{ inputs.platform == 'macos' }}
      uses: Homebrew/actions/setup-homebrew@master

    - name: MacOS - Install dependencies
      shell: sh
      if: ${{ inputs.platform == 'macos' }}
      run: brew install autoconf automake libtool

    # Windows only

    - name: Windows - Set up mingw64
      if: ${{ inputs.platform == 'windows' }}
      shell: sh
      run: |
        sudo apt-get install mingw-w64
        sudo apt-get install autotools-dev autoconf libtool-bin
        sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
        sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

    # Dependencies of godot
    # Use python 3.x release (works cross platform)
    - name: Set up Python 3.x
      uses: actions/setup-python@v5
      with:
        # Semantic version range syntax or exact version of a Python version
        python-version: "3.x"
        # Optional - x64 or x86 architecture, defaults to x64
        architecture: "x64"

    - name: Set up scons
      shell: bash
      run: |
        python -c "import sys; print(sys.version)"
        python -m pip install scons
        scons --version

    - name: Set up cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/libm8gd/target/
        key: ${{ inputs.platform }}_${{ inputs.arch }}_${{ inputs.build-target-type }}_cache
        restore-keys: |
          ${{ inputs.platform }}_${{ inputs.arch }}_${{ inputs.build-target-type }}_cache
          ${{ inputs.platform }}_${{ inputs.arch }}_
          ${{ inputs.platform }}_

    - name: Compile extension
      shell: bash
      env:
        SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        SCONS_CACHE_LIMIT: 4096
      run: |
        python build.py --target=${{ inputs.build-target-type }} --platform=${{ inputs.platform }} --extension-only
      working-directory: ${{ inputs.gdextension-directory }}
